name: AEON Contract Integrity

on:
  push:
    branches: [main]
    paths:
      - "08_ENGINE/experimental-protocol-model/v0.1/**"
      - ".github/workflows/aeon-contract-integrity.yml"
  pull_request:
    paths:
      - "08_ENGINE/experimental-protocol-model/v0.1/**"
      - ".github/workflows/aeon-contract-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-integrity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08_ENGINE/experimental-protocol-model/v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python validator.py --examples
      - run: python -m pytest -q tests
      - run: python compiler.py --check