name: Deploy AEON Sound Field MVP

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "08_ENGINE/sound-field-v0.3/**"
      - "08_ENGINE/experimental-protocol-model/**"
      - ".github/workflows/deploy-sound-field-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4